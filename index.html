<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vida Fit — Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
<style>
/* ===== Tema claro premium (padrão) — teal do iOS ===== */
:root{
  --bg:#F4F6F7; --surface:#FFFFFF; --raised:#F2F4F5; --line:#E6EAEC; --line-strong:#D3D9DC;
  --text:#0B1215; --muted:#5F6B70; --faint:#98A2A6;
  --brand:#0A8FA6; --brand-2:#34C3D9; --brand-ink:#FFFFFF; --brand-soft:#E2F5F8;
  --track:#ECEFF1; --thumb:#FFFFFF;
  --warn:#C26A00; --warn-soft:#FFF2DE; --danger:#E0352B; --danger-soft:#FDE7E5;
  --info:#4F4CD0; --info-soft:#ECEBFC; --pink:#E5285A; --pink-soft:#FDE6EC;
  --shadow:0 1px 1px rgba(11,18,21,.03),0 6px 16px rgba(11,18,21,.05),0 18px 40px -12px rgba(10,143,166,.10);
  --glass:rgba(255,255,255,.72);
  --glow-a:rgba(52,195,217,.14); --glow-b:rgba(10,143,166,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#071417; --surface:#0E2126; --raised:#142B31; --line:#1D3A41; --line-strong:#2A4D55;
    --text:#EAF4F5; --muted:#9DB5B9; --faint:#6B878C;
    --glow-a:rgba(64,200,224,.16); --glow-b:rgba(30,120,140,.20);
    --brand:#40C8E0; --brand-2:#64D8EA; --brand-ink:#002228; --brand-soft:rgba(64,200,224,.14);
    --track:#10272C; --thumb:#24434A;
    --warn:#FFB340; --warn-soft:rgba(255,179,64,.14); --danger:#FF6961; --danger-soft:rgba(255,105,97,.14);
    --info:#8E8CFF; --info-soft:rgba(142,140,255,.15); --pink:#FF6B8E; --pink-soft:rgba(255,107,142,.14);
    --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 12px 30px rgba(0,0,0,.5);
    --glass:rgba(10,28,32,.72);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#071417; --surface:#0E2126; --raised:#142B31; --line:#1D3A41; --line-strong:#2A4D55;
  --text:#EAF4F5; --muted:#9DB5B9; --faint:#6B878C;
  --glow-a:rgba(64,200,224,.16); --glow-b:rgba(30,120,140,.20);
  --brand:#40C8E0; --brand-2:#64D8EA; --brand-ink:#002228; --brand-soft:rgba(64,200,224,.14);
  --track:#10272C; --thumb:#24434A;
  --warn:#FFB340; --warn-soft:rgba(255,179,64,.14); --danger:#FF6961; --danger-soft:rgba(255,105,97,.14);
  --info:#8E8CFF; --info-soft:rgba(142,140,255,.15); --pink:#FF6B8E; --pink-soft:rgba(255,107,142,.14);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 12px 30px rgba(0,0,0,.5);
  --glass:rgba(10,28,32,.72);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.4,.5,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",Roboto,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:radial-gradient(1200px 700px at 85% -10%,var(--glow-a),transparent 60%),radial-gradient(900px 600px at -10% 110%,var(--glow-b),transparent 60%),var(--bg);background-attachment:fixed;color:var(--text);font:15px/1.5 var(--font);font-feature-settings:"cv11","ss03";-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;min-height:100vh;letter-spacing:-.006em;transition:background .4s var(--ease),color .4s var(--ease)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
h1,h2,h3{font-family:var(--font-display);letter-spacing:-.022em}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum","ss01","cv11"}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:2px;border-radius:12px}
img{max-width:100%}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 60px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:0 -20px 22px;padding:14px 20px;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.wrap>.panel:first-child{margin-top:24px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:-.03em}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,var(--brand-2),var(--brand));color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800;letter-spacing:-.04em;box-shadow:0 6px 14px -4px color-mix(in srgb,var(--brand) 55%,transparent)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.main-split{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)}
@media (max-width:960px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.main-split{grid-template-columns:1fr}}
@media (max-width:620px){.g4,.g2,.g3{grid-template-columns:1fr}.wrap{padding:0 14px 48px}.top{margin:0 -14px 18px;padding:12px 14px}}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:22px}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.panel h2{font-size:19px;margin:0;font-weight:700}
.sub{color:var(--muted);font-size:13.5px;margin:3px 0 0;letter-spacing:-.003em}
.well{background:var(--raised);border-radius:16px;padding:16px}

/* stats */
.stat{position:relative;overflow:hidden;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.stat:hover{transform:translateY(-3px)}
.stat .lbl{color:var(--muted);font-size:13.5px;font-weight:600}
.stat .val{font-family:var(--font-display);font-size:44px;font-weight:700;line-height:1;margin:10px 0 14px;letter-spacing:-.045em}
.stat .ico{position:absolute;top:18px;right:18px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.p-green{background:var(--brand-soft);color:var(--brand)}
.p-blue{background:var(--info-soft);color:var(--info)}
.p-pink{background:var(--pink-soft);color:var(--pink)}
.p-amber{background:var(--warn-soft);color:var(--warn)}
.p-red{background:var(--danger-soft);color:var(--danger)}
.p-gray{background:var(--surface);color:var(--muted);border:1px solid var(--line)}

/* controles — segmentado no estilo iOS */
.seg{display:inline-flex;background:var(--track);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 18px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .3s var(--ease),color .3s var(--ease),box-shadow .3s var(--ease)}
.seg button[aria-selected="true"]{background:var(--thumb);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08),0 3px 8px rgba(0,0,0,.06)}
.btn{border:0;border-radius:13px;padding:12px 18px;font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,var(--brand-2),var(--brand));color:#fff;box-shadow:0 8px 18px -8px color-mix(in srgb,var(--brand) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .25s var(--spring),box-shadow .25s var(--ease),filter .2s}
:root[data-theme="dark"] .btn:not(.ghost):not(.danger):not(.soft){color:var(--brand-ink)}
.btn:hover{filter:brightness(1.05);box-shadow:0 12px 24px -10px color-mix(in srgb,var(--brand) 75%,transparent),inset 0 1px 0 rgba(255,255,255,.25)}
.btn:active,.quick:active,.choice button:active,.seg button:active,.theme-btn:active{transform:scale(.96)}
.btn.ghost{background:var(--raised);color:var(--text);box-shadow:none}
.btn.danger{background:var(--danger-soft);color:var(--danger);box-shadow:none}
.btn.soft{background:var(--brand-soft);color:var(--brand);border:1px solid color-mix(in srgb,var(--brand) 35%,transparent);box-shadow:none;font-weight:700}
.btn.soft svg{transition:transform .3s var(--ease)}
.btn.soft:hover{background:linear-gradient(180deg,var(--brand-2),var(--brand));color:#fff;border-color:transparent;box-shadow:0 10px 22px -10px color-mix(in srgb,var(--brand) 80%,transparent);filter:none}
:root[data-theme="dark"] .btn.soft:hover{color:var(--brand-ink)}
.btn.soft:hover svg{transform:translateX(3px)}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:11px}
.btn.block{width:100%}
label.f{display:block;font-size:13.5px;font-weight:600;margin-bottom:7px;color:var(--muted)}
.inp{width:100%;background:var(--raised);border:1px solid transparent;border-radius:12px;padding:12px 14px;outline:none;transition:border-color .2s,box-shadow .25s var(--ease),background .2s}
.inp::placeholder{color:var(--faint)}
.inp:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 4px var(--brand-soft)}
textarea.inp{min-height:80px;resize:vertical}
.hint{font-size:12.5px;color:var(--faint);margin-top:6px}
.err{font-size:13.5px;color:var(--danger);margin-top:10px;min-height:1em}
.err:not(:empty){animation:shake .35s var(--ease)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--track);padding:3px;border-radius:12px}
.choice button{border:0;background:transparent;border-radius:9px;padding:9px;font-weight:600;cursor:pointer;color:var(--muted);transition:all .3s var(--ease)}
.choice button[aria-pressed="true"]{background:var(--thumb);color:var(--brand);box-shadow:0 1px 2px rgba(0,0,0,.08),0 3px 8px rgba(0,0,0,.06)}

/* login */
.auth{min-height:100vh;display:grid;place-items:center;padding:32px 16px;background:radial-gradient(900px 500px at 50% -10%,var(--brand-soft),transparent 70%)}
.auth-card{width:100%;max-width:500px}
.auth-title{text-align:center;margin-bottom:26px}
.auth-title h1{font-size:34px;font-weight:700;letter-spacing:-.04em;margin:16px 0 4px}
.tabs-auth{display:grid;grid-template-columns:1fr 1fr;background:var(--track);border-radius:12px;padding:3px;gap:2px;margin-bottom:22px}
.tabs-auth button{border:0;background:transparent;padding:9px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;border-radius:9px;transition:all .3s var(--ease)}
.tabs-auth button[aria-selected="true"]{background:var(--thumb);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08),0 3px 8px rgba(0,0,0,.06)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px}
.steps div{font-size:13px;font-weight:600;color:var(--faint);padding-top:10px;position:relative}
.steps div::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;border-radius:4px;background:var(--track)}
.steps div::after{content:"";position:absolute;top:0;left:0;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--brand-2),var(--brand));width:0;transition:width .6s var(--ease)}
.steps div.on,.steps div.done{color:var(--text)}
.steps div.on::after,.steps div.done::after{width:100%}
.photo{border:1.5px dashed var(--line-strong);border-radius:16px;aspect-ratio:3/4;display:grid;place-items:center;overflow:hidden;cursor:pointer;background:var(--raised);position:relative;color:var(--faint);font-size:13px;text-align:center;padding:6px;transition:border-color .2s,transform .3s var(--ease)}
.photo:hover{border-color:var(--brand);color:var(--brand)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:fade .4s var(--ease)}
.photo input{display:none}

/* listas */
.agenda-item{display:flex;justify-content:space-between;gap:10px;padding:14px 16px;border-radius:16px;background:var(--raised)}
.agenda-item b{display:block;font-size:15px;font-weight:600;letter-spacing:-.012em}
.agenda-item small{color:var(--muted);font-size:13.5px}
.stack{display:flex;flex-direction:column;gap:10px}
.student{display:flex;flex-direction:column;gap:12px;transition:transform .35s var(--ease),border-color .3s;background:radial-gradient(120% 70% at 0% 0%,var(--brand-soft),transparent 60%),var(--surface)}
.student:hover{border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
.student .kv{background:var(--raised);border-radius:14px;padding:14px}
.student:hover{transform:translateY(-3px)}
.student h3{margin:0;font-size:17px;font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.quick{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer;text-align:left;width:100%;transition:transform .3s var(--ease),border-color .2s,box-shadow .3s var(--ease)}
.quick:hover{border-color:var(--brand);box-shadow:var(--shadow);transform:translateY(-2px)}
.quick svg{color:var(--faint);transition:transform .3s var(--ease),color .2s}
.quick:hover svg{transform:translateX(3px);color:var(--brand)}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,var(--brand-2),var(--brand));color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:-.03em;flex:none}
.metric{text-align:center}
.metric .lbl{font-size:12.5px;color:var(--muted);font-weight:600}
.metric .num{font-family:var(--font-display);font-size:26px;font-weight:700;margin-top:6px;letter-spacing:-.035em}
.chart-box{min-height:200px;display:flex;flex-direction:column}
.chart-box h3{font-size:14px;margin:0 0 10px;font-weight:600;color:var(--muted);font-family:var(--font);letter-spacing:-.006em}
.empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--faint);font-size:13.5px;padding:16px}
.tabs-line{display:flex;gap:2px;overflow-x:auto;background:var(--track);padding:3px;border-radius:12px;margin-bottom:18px;width:fit-content;max-width:100%}
.tabs-line button{border:0;background:transparent;padding:8px 14px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap;border-radius:9px;transition:all .3s var(--ease)}
.tabs-line button[aria-selected="true"]{background:var(--thumb);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08),0 3px 8px rgba(0,0,0,.06)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr{transition:background .2s}
tbody tr:hover{background:var(--raised)}
th{color:var(--muted);font-weight:600;font-size:13px}
td.num,th.num{text-align:right}
.highlight{background:linear-gradient(135deg,var(--brand-soft),transparent 120%);border:1px solid color-mix(in srgb,var(--brand) 25%,transparent);border-radius:16px;padding:16px}
.highlight b{color:var(--brand)}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px) scale(.96);background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);color:var(--text);border:1px solid var(--line);box-shadow:var(--shadow);padding:12px 20px;border-radius:999px;font-weight:600;font-size:14px;z-index:50;opacity:0;transition:opacity .3s var(--ease),transform .45s var(--spring);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.theme-btn{border:0;background:var(--raised);border-radius:50%;width:38px;height:38px;cursor:pointer;display:grid;place-items:center;transition:transform .25s var(--spring)}

/* gráficos */
.dot{transition:r .2s var(--ease)}
.dot:hover{r:6}

/* ===== Animações: uma entrada coordenada a cada troca de tela ===== */
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.animate .panel,.animate .auth-title{animation:rise .7s var(--ease) both}
.animate .grid>*:nth-child(2){animation-delay:.06s}
.animate .grid>*:nth-child(3){animation-delay:.12s}
.animate .grid>*:nth-child(4){animation-delay:.18s}
.animate .grid>*:nth-child(5){animation-delay:.24s}
.animate .grid>*:nth-child(6){animation-delay:.30s}
.animate .main-split{animation:fade .01s .2s both}
.animate .main-split>.panel:nth-child(1){animation-delay:.22s}
.animate .main-split>.panel:nth-child(2){animation-delay:.3s}
.animate .grid+.grid+.panel,.animate .main-split+.panel{animation-delay:.38s}
.animate .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s .45s cubic-bezier(.65,0,.35,1) forwards}
.animate .dot{animation:pop .45s var(--spring) both}
.animate .tab-body>*{animation:rise .5s var(--ease) both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.animate .draw{stroke-dashoffset:0}}
</style>

</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===================== Dados (tudo fictício, salvo só neste navegador) ===================== */
const KEY = "vidafit-replica-v1";
const ADMIN = { usuario: "admin", senha: "123" }; // acesso fixo do administrador
const TEMPOS = ["30 minutos por dia","45 minutos por dia","1 hora por dia","1h30 ou mais por dia"];
const OBJETIVOS = ["Emagrecimento","Ganho de massa","Condicionamento","Saúde e bem-estar","Corrida"];

function seed(){
  const hoje = new Date();
  const d = n => { const x = new Date(hoje); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); };
  return {
    students: [
      { id: uid(), nome:"Carla Teste Ribeiro", usuario:"carla", senha:"123", telefone:"(00) 90000-0001", genero:"F",
        objetivo:"Emagrecimento", nascimento:"1994-03-12", altura:1.65, peso:78, lesao:"Não", medicamento:"Não",
        restricao:"Intolerância à lactose", tempo:"1 hora por dia", fotos:{}, criado:d(-60),
        avaliacoes:[{data:d(-60),peso:78,gordura:34.2,massa:27.1,bmr:1480},{data:d(-30),peso:76.1,gordura:32.6,massa:27.6,bmr:1492},{data:d(-2),peso:74.4,gordura:30.9,massa:28.3,bmr:1510}],
        bios:[{data:d(-2),agua:51.2,visceral:7,idade:33}], plano:"Café: ovos mexidos + fruta\nAlmoço: arroz, feijão, frango, salada\nLanche: iogurte sem lactose + aveia\nJantar: peixe + legumes", treino:"Seg/Qua/Sex: musculação full body (45 min)\nTer/Qui: caminhada rápida 30 min" },
      { id: uid(), nome:"Bruno Exemplo Lima", usuario:"bruno", senha:"123", telefone:"", genero:"M",
        objetivo:"Ganho de massa", nascimento:"1990-08-02", altura:1.78, peso:72, lesao:"Dor leve no joelho ao agachar", medicamento:"Não",
        restricao:"Nenhuma", tempo:"1h30 ou mais por dia", fotos:{}, criado:d(-5),
        avaliacoes:[{data:d(-5),peso:72,gordura:16.8,massa:34.9,bmr:1720}], bios:[], plano:"", treino:"" }
    ],
    agenda: [
      { id: uid(), nome:"Carla Teste Ribeiro", quando:d(0)+"T15:00", tipo:"Bioimpedância", status:"Confirmado" },
      { id: uid(), nome:"Bruno Exemplo Lima", quando:d(1)+"T09:30", tipo:"Avaliação física", status:"Confirmado" },
      { id: uid(), nome:"Paciente Demonstração", quando:d(4)+"T18:00", tipo:"Retorno geral", status:"Pendente" }
    ]
  };
}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (n, dec=1) => (n === null || n === undefined || isNaN(n)) ? "—" : Number(n).toLocaleString("pt-BR",{minimumFractionDigits:dec,maximumFractionDigits:dec});
const dataBR = iso => iso ? new Date(iso+"T12:00").toLocaleDateString("pt-BR") : "—";
const firstName = nome => (nome||"").trim().split(/\s+/)[0] || "";
const usuarioDe = nome => firstName(nome).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const iniciais = nome => (nome||"?").trim().split(/\s+/).slice(0,2).map(p=>p[0]).join("").toUpperCase();
const idade = iso => { if(!iso) return null; const b=new Date(iso), n=new Date(); let a=n.getFullYear()-b.getFullYear(); if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate())) a--; return a; };
const ultima = s => s.avaliacoes?.length ? s.avaliacoes[s.avaliacoes.length-1] : null;
const imc = (peso, alt) => (peso && alt) ? peso/(alt*alt) : null;
function imcClasse(v){ if(v==null) return ["—","p-gray"]; if(v<18.5) return ["Abaixo do peso","p-amber"]; if(v<25) return ["Peso adequado","p-green"]; if(v<30) return ["Sobrepeso","p-amber"]; return ["Obesidade","p-red"]; }
function quandoTxt(iso){
  const d = new Date(iso), h = new Date(); h.setHours(0,0,0,0);
  const dia = new Date(d); dia.setHours(0,0,0,0);
  const diff = Math.round((dia-h)/864e5);
  const hora = d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  if(diff===0) return "Hoje, "+hora; if(diff===1) return "Amanhã, "+hora;
  return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"}).replace(".","")+", "+hora;
}

/* gráfico de linha simples em SVG */
function lineChart(pts, unit, color="var(--brand)"){
  if(pts.length < 2) return `<div class="empty">${pts.length===1 ? `Só há 1 registro (${fmt(pts[0].y)} ${unit}).<br>Registre outra avaliação para ver a evolução.` : "Nenhuma avaliação registrada ainda.<br>Abra a ficha do aluno e adicione a primeira."}</div>`;
  const W=320,H=150,P={l:34,r:10,t:14,b:26};
  const ys=pts.map(p=>p.y); let mn=Math.min(...ys), mx=Math.max(...ys); const pad=(mx-mn)*.25||1; mn-=pad; mx+=pad;
  const X=i=>P.l+i*(W-P.l-P.r)/(pts.length-1), Y=v=>P.t+(mx-v)*(H-P.t-P.b)/(mx-mn);
  const line=pts.map((p,i)=>`${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join(" ");
  const grid=[0,.5,1].map(f=>{const v=mx-(mx-mn)*f, y=Y(v);return `<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${P.l-6}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--faint)">${fmt(v,0)}</text>`}).join("");
  const dots=pts.map((p,i)=>`<circle class="dot" style="animation-delay:${(0.5+i*0.12).toFixed(2)}s" cx="${X(i)}" cy="${Y(p.y)}" r="4" fill="var(--surface)" stroke="${color}" stroke-width="2.5"><title>${p.x}: ${fmt(p.y)} ${unit}</title></circle><text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--faint)">${p.x}</text>`).join("");
  const d = pts[pts.length-1].y - pts[0].y;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolução em ${unit}">${grid}<defs><linearGradient id="g${unit==='%'?'p':'b'}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".18"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><polygon points="${P.l},${H-P.b} ${line} ${W-P.r},${H-P.b}" fill="url(#g${unit==='%'?'p':'b'})" class="area"/><polyline class="draw" pathLength="1" points="${line}" fill="none" stroke="${color}" stroke-width="2.75" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>
  <div class="row between" style="font-size:13px;margin-top:6px"><span style="color:var(--muted)">Variação no período</span><b class="num">${d>0?"+":""}${fmt(d)} ${unit}</b></div>`;
}

let ui = { view:"login", authTab:"login", step:1, draft:null, dashTab:"geral", chartStudent:null, studentId:null, fichaTab:"cadastro", busca:"", filtro:"todos", sessao:null };
function go(patch){
  const nav=["view","dashTab","fichaTab","authTab","step","studentId","filtro"].some(k=>k in patch && patch[k]!==ui[k]);
  Object.assign(ui, patch); ui._anim=nav; render(); ui._anim=false;
  if(nav && ["view","studentId"].some(k=>k in patch)) window.scrollTo({top:0});
}

function toggleTheme(){
  const r=document.documentElement, cur=r.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  r.dataset.theme = cur==="dark"?"light":"dark";
}

function entrar(){
  // Login só com usuário e senha: sem e-mail. Aceita maiúsculas, acentos ou nome completo (usa o 1º nome).
  const u=usuarioDe($("#lu").value), s=$("#ls").value.trim(), err=$("#lerr");
  err.textContent="";
  if(!u||!s){ err.textContent="Preencha usuário e senha."; return; }
  if(u===ADMIN.usuario){
    if(s!==ADMIN.senha){ err.textContent="Senha do administrador incorreta."; return; }
    const ses={tipo:"admin"}; guardarSessao(ses); ui.novoUsuario=null;
    go({view:"painel",dashTab:"geral",sessao:ses}); return;
  }
  load(); // relê os dados para pegar cadastros recém-feitos
  const al=db.students.find(x=>x.usuario===u);
  if(!al){ err.textContent=`Não existe o usuário “${u}”. Use seu primeiro nome ou faça o cadastro na aba ao lado.`; return; }
  if(al.senha!==s){ err.textContent=`Senha incorreta para o usuário “${u}”.`; return; }
  const ses={tipo:"aluno",id:al.id}; guardarSessao(ses); ui.novoUsuario=null;
  go({view:"ficha",studentId:al.id,fichaTab:"cadastro",sessao:ses});
}

        <div><label class="f" for="cp">Peso (kg)</label><input class="inp num" id="cp" inputmode="decimal" value="${esc(d.peso)}" placeholder="70,5" oninput="ui.draft.peso=this.value"></div>

    const q=(id,lbl,ph)=>`<label class="f" for="${id}">${lbl}</label><textarea class="inp" id="${id}" placeholder="${ph}" oninput="ui.draft.${id}=this.value">${esc(d[id])}</textarea><div style="height:12px"></div>`;

    ${q("lesao","Tem alguma lesão ou limitação articular?","Ex.: Não / Dor no joelho ao agachar")}
    ${q("medicamento","Usa algum medicamento contínuo?","Ex.: Não / Remédio para pressão")}
    ${q("restricao","Tem restrição alimentar ou alergia?","Ex.: Nenhuma / Intolerância à lactose")}
    <label class="f" for="ctmp">Tempo livre para treinar por dia</label><select class="inp" id="ctmp" onchange="ui.draft.tempo=this.value">${TEMPOS.map(o=>`<option ${o===d.tempo?"selected":""}>${o}</option>`).join("")}</select>`;
  } else {
    const slots=[["frente","Frente"],["direita","Lateral direita"],["esquerda","Lateral esquerda"],["costas","Costas"]];
    body=`<h2 style="font-size:16px;margin:0 0 4px">Fotos de postura</h2><p class="sub" style="margin-bottom:12px">Ambiente bem iluminado, corpo inteiro, roupa de treino justa (top e short, ou bermuda sem camisa), pés descalços. As fotos são opcionais no teste.</p>

function mascTel(el){ let v=el.value.replace(/\D/g,"").slice(0,11); if(v.length>6) v=`(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`; else if(v.length>2) v=`(${v.slice(0,2)}) ${v.slice(2)}`; el.value=v; return v; }
const num = v => { const n=parseFloat(String(v).replace(",",".")); return isNaN(n)?null:n; };
function avancar(){
  const d=ui.draft, e=$("#cerr");
  if(ui.step===1){
    if(d.nome.trim().split(/\s+/).length<2){ e.textContent="Informe nome e sobrenome."; return; }
    if((d.senha||"").length<3){ e.textContent="A senha precisa ter pelo menos 3 caracteres."; return; }
    if(db.students.some(s=>s.usuario===usuarioDe(d.nome))){ e.textContent=`Já existe um aluno com o usuário “${usuarioDe(d.nome)}”. Use outro primeiro nome ou fale com o admin.`; return; }
    const a=num(d.altura); if(a && (a<1||a>2.3)){ e.textContent="Altura em metros, ex.: 1,65."; return; }
  }
  go({step:ui.step+1});
}
function lerFoto(inp,k){
  const f=inp.files[0]; if(!f) return;
  const img=new Image(), r=new FileReader();
  r.onload=()=>{ img.onload=()=>{ const c=document.createElement("canvas"), s=360/Math.max(img.width,img.height); c.width=img.width*s; c.height=img.height*s; c.getContext("2d").drawImage(img,0,0,c.width,c.height); ui.draft.fotos[k]=c.toDataURL("image/jpeg",.72); render(); }; img.src=r.result; };
  r.readAsDataURL(f);
}
function concluir(){
  const d=ui.draft, peso=num(d.peso), alt=num(d.altura), hoje=new Date().toISOString().slice(0,10);
  const s={ id:uid(), nome:d.nome.trim(), usuario:usuarioDe(d.nome), senha:d.senha, telefone:d.telefone, genero:d.genero, objetivo:d.objetivo,
    nascimento:d.nascimento, altura:alt, peso, lesao:d.lesao.trim()||"Não informado", medicamento:d.medicamento.trim()||"Não informado",
    restricao:d.restricao.trim()||"Não informado", tempo:d.tempo, fotos:d.fotos, criado:hoje,
    avaliacoes: peso ? [{data:hoje,peso,gordura:null,massa:null,bmr:null}] : [], bios:[], plano:"", treino:"" };
  db.students.push(s); save();
  if(ui.sessao?.tipo==="admin"){ toast(`${firstName(s.nome)} cadastrado. Usuário: ${s.usuario}`); go({view:"painel",dashTab:"alunos",draft:null,step:1}); return; }
  ui.novoUsuario=s.usuario;
  go({authTab:"login",draft:null,step:1});
  setTimeout(()=>{ const p=$("#ls"); if(p) p.focus(); },60);
}

function mediaMetas(){
  const com=db.students.filter(s=>s.avaliacoes.filter(a=>a.gordura!=null).length>=2);
  if(!com.length) return null;
  let g=0,m=0;
  com.forEach(s=>{ const av=s.avaliacoes.filter(a=>a.gordura!=null), a0=av[0], a1=av[av.length-1];
    g+=(a0.peso*a0.gordura/100)-(a1.peso*a1.gordura/100); m+=(a1.massa||0)-(a0.massa||0); });
  return {n:com.length, gordura:g/com.length, massa:m/com.length};
}

function painelGeral(){
  const S=db.students, mes=new Date().toISOString().slice(0,7);
  const novos=S.filter(s=>(s.criado||"").startsWith(mes)).length;
  const hojeStr=new Date().toISOString().slice(0,10);

  if(!ui.chartStudent || !S.find(s=>s.id===ui.chartStudent)) ui.chartStudent=S[0]?.id||null;
  const cs=S.find(s=>s.id===ui.chartStudent);
  const pts=k=>cs?cs.avaliacoes.filter(a=>a[k]!=null).map(a=>({x:dataBR(a.data).slice(0,5),y:a[k]})):[];
  const ul=cs?ultima(cs):null;
  const lastOf=k=>{ const a=cs?.avaliacoes.filter(x=>x[k]!=null); return a?.length?a[a.length-1][k]:null; };
  const vImc=ul?imc(ul.peso,cs.altura):null, [cl,cc]=imcClasse(vImc);
  const metas=mediaMetas();

  return `
  <div class="grid g4" style="margin-bottom:16px">
    ${stat("Alunos ativos",S.length,ico.users,"p-green",`${novos} novo${novos===1?"":"s"} este mês`)}
    ${stat("Consultas agendadas",db.agenda.length,ico.cal,"p-blue",`${consultasHoje} hoje`)}
    ${stat("Avaliações físicas",nAv,ico.heart,"p-pink","Composição corporal")}
    ${stat("Bioimpedâncias",nBio,ico.drop,"p-amber","Hidratação e gordura visceral")}
  </div>
  <div class="grid main-split" style="margin-bottom:16px">
    <section class="panel">
      <div class="panel-head"><div><h2>Evolução da composição corporal</h2><p class="sub">Histórico das avaliações do aluno selecionado</p></div>
        ${S.length?`<select class="inp" style="width:auto;min-width:180px" aria-label="Aluno do gráfico" onchange="go({chartStudent:this.value})">${S.map(s=>`<option value="${s.id}" ${s.id===ui.chartStudent?"selected":""}>${esc(s.nome)}</option>`).join("")}</select>`:""}</div>
      ${cs?`<div class="grid g2">
        <div class="well chart-box"><h3>Peso corporal (kg)</h3>${lineChart(pts("peso"),"kg")}</div>
        <div class="well chart-box"><h3>Gordura corporal (%)</h3>${lineChart(pts("gordura"),"%","var(--pink)")}</div>
      </div>
      <div class="grid g3" style="margin-top:12px">
        <div class="well metric"><div class="lbl">Massa muscular</div><div class="num">${lastOf("massa")!=null?fmt(lastOf("massa"))+" kg":"—"}</div></div>
        <div class="well metric"><div class="lbl">Metabolismo basal</div><div class="num">${lastOf("bmr")!=null?fmt(lastOf("bmr"),0)+" kcal":"—"}</div></div>
        <div class="well metric"><div class="lbl">IMC atual</div><div class="num">${fmt(vImc)}</div><span class="pill ${cc}" style="margin-top:6px">${cl}</span></div>
      </div>`:`<div class="empty well" style="min-height:200px">Nenhum aluno cadastrado ainda.<br><button class="btn sm" style="margin-top:10px" onclick="go({dashTab:'alunos'})">Cadastrar aluno</button></div>`}
    </section>
    <section class="panel">
      <div class="panel-head"><div><h2>Agenda de atendimentos</h2><p class="sub">Próximos horários</p></div></div>
      <div class="stack">${db.agenda.slice().sort((a,b)=>a.quando.localeCompare(b.quando)).map(a=>`
        <div class="agenda-item"><div><b>${esc(a.nome)}</b><small class="num">${quandoTxt(a.quando)}</small><div style="margin-top:6px"><span class="pill p-gray">${esc(a.tipo)}</span></div></div>
        <button class="pill ${a.status==="Confirmado"?"p-green":"p-amber"}" style="border:0;cursor:pointer;height:fit-content" title="Clique para alternar o status" onclick="toggleAg('${a.id}')">${a.status}</button></div>`).join("")}</div>
      <div class="highlight" style="margin-top:14px">
        ${metas?`<div style="font-weight:700;margin-bottom:4px">Resultado dos alunos acompanhados</div>
        <div style="font-size:14px">Média de <b class="num">${fmt(metas.gordura)} kg</b> de gordura a menos e <b class="num">${metas.massa>=0?"+":""}${fmt(metas.massa)} kg</b> de massa magra, considerando ${metas.n} aluno${metas.n>1?"s":""} com 2 ou mais avaliações.</div>`
        :`<div style="font-size:14px">Assim que um aluno tiver 2 avaliações completas, a média de resultados aparece aqui.</div>`}
      </div>
    </section>
  </div>
  <section class="panel">
    <div class="panel-head"><div><h2>Acesso rápido às fichas</h2><p class="sub">Escolha um aluno para abrir a ficha completa</p></div></div>
    <div class="grid g3">${S.map(s=>`<button class="quick" onclick="abrirFicha('${s.id}')"><span class="row"><span class="avatar">${iniciais(s.nome)}</span><span><b>${esc(s.nome)}</b><br><small style="color:var(--muted)">${esc(s.objetivo)}</small></span></span>${ico.chev}</button>`).join("")||'<p class="sub">Nenhum aluno ainda.</p>'}</div>
  </section>`;
}
function toggleAg(id){ const a=db.agenda.find(x=>x.id===id); a.status=a.status==="Confirmado"?"Pendente":"Confirmado"; save(); render(); }
function abrirFicha(id){ go({view:"ficha",studentId:id,fichaTab:"cadastro"}); }

function painelAlunos(){
  const q=ui.busca.toLowerCase();
  let L=db.students.filter(s=>!q || s.nome.toLowerCase().includes(q) || s.usuario.includes(q));
  const pend=s=>s.avaliacoes.filter(a=>a.gordura!=null).length===0;
  const nPend=db.students.filter(pend).length;
  if(ui.filtro==="pendentes") L=L.filter(pend);
  if(ui.filtro==="avaliados") L=L.filter(s=>!pend(s));
  const f=(k,l,n)=>`<button role="tab" aria-selected="${ui.filtro===k}" onclick="go({filtro:'${k}'})">${l} <span class="num">${n}</span></button>`;
  return `
  <div class="row between" style="margin-bottom:16px">
    <input class="inp" style="max-width:340px" placeholder="Buscar por nome ou usuário" value="${esc(ui.busca)}" oninput="ui.busca=this.value;clearTimeout(window._b);window._b=setTimeout(()=>{render();const i=document.querySelector('.inp');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)">
    <div class="row">
      <div class="seg" role="tablist">${f("todos","Todos",db.students.length)}${f("pendentes","Sem avaliação",nPend)}${f("avaliados","Avaliados",db.students.length-nPend)}</div>
      <button class="btn" onclick="go({view:'login',authTab:'cadastro',step:1,draft:novoDraft()})">Novo aluno</button>
    </div>
  </div>
  <div class="grid g3">${L.map(s=>{ const u=ultima(s), v=u?imc(u.peso,s.altura):null;
    return `<article class="panel student">
      <div class="row between"><span class="row"><span class="avatar">${iniciais(s.nome)}</span><span><h3>${esc(s.nome)}</h3><small style="color:var(--muted)">Usuário: ${esc(s.usuario)}</small></span></span>
      ${pend(s)?'<span class="pill p-amber">Sem avaliação</span>':'<span class="pill p-green">Avaliado</span>'}</div>
      <dl class="kv">
        <dt>Objetivo</dt><dd>${esc(s.objetivo)}</dd>
        <dt>Perfil</dt><dd>${s.genero==="F"?"Feminino":"Masculino"}${idade(s.nascimento)!=null?`, ${idade(s.nascimento)} anos`:""}</dd>
        <dt>Peso atual</dt><dd class="num">${u?fmt(u.peso)+" kg":"—"}${v?` · IMC ${fmt(v)}`:""}</dd>
        <dt>Restrição</dt><dd>${esc(s.restricao)}</dd>
      </dl>
      <button class="btn soft block" onclick="abrirFicha('${s.id}')">Ver ficha completa ${ico.chev}</button>
    </article>`}).join("") || '<p class="sub">Nenhum aluno encontrado com esse filtro.</p>'}</div>`;
}

/* ===================== Ficha do aluno ===================== */
function viewFicha(){
  const s=db.students.find(x=>x.id===ui.studentId);
  if(!s){ go({view:ui.sessao?.tipo==="admin"?"painel":"login"}); return ""; }
  const admin=ui.sessao?.tipo==="admin";
  const tabs=[["cadastro","Ficha cadastral"],["avaliacao","Avaliação física"],["bio","Bioimpedância"],["plano","Plano alimentar"],["treino","Treinos"],["relatorio","Relatório"]];
  return `<div class="wrap">
    <div class="panel row between" style="margin-bottom:16px">
      <div class="row">${admin?`<button class="theme-btn" aria-label="Voltar ao painel" onclick="go({view:'painel'})">${ico.back}</button>`:""}
        <span class="avatar">${iniciais(s.nome)}</span><div><h2 style="font-size:19px;margin:0">${esc(s.nome)}</h2><p class="sub">Objetivo: ${esc(s.objetivo)}</p></div></div>
      <div class="row"><button class="theme-btn" aria-label="Alternar tema" onclick="toggleTheme()">◐</button>
        ${admin?`<button class="btn danger sm" onclick="excluir('${s.id}')">Excluir aluno</button>`:`<button class="btn ghost sm" onclick="sair()">Sair</button>`}</div>
    </div>
    <div class="tabs-line" role="tablist">${tabs.map(([k,n])=>`<button role="tab" aria-selected="${ui.fichaTab===k}" onclick="go({fichaTab:'${k}'})">${n}</button>`).join("")}</div>
    <div class="panel tab-body"><div>${fichaTab(s,admin)}</div></div>
  </div>`;
}
function fichaTab(s,admin){
  const t=ui.fichaTab, u=ultima(s);
  if(t==="cadastro"){
    const fotos=Object.entries(s.fotos||{});
    return `<div class="grid g2">
      <div class="well"><h3 style="font-size:15px;margin:0 0 10px">Dados pessoais</h3><dl class="kv">
        <dt>Nome</dt><dd>${esc(s.nome)}</dd><dt>Usuário</dt><dd>${esc(s.usuario)}</dd>
        <dt>Nascimento</dt><dd>${dataBR(s.nascimento)}${idade(s.nascimento)!=null?` (${idade(s.nascimento)} anos)`:""}</dd>
        <dt>Sexo biológico</dt><dd>${s.genero==="F"?"Feminino":"Masculino"}</dd>
        <dt>WhatsApp</dt><dd>${esc(s.telefone)||"Não informado"}</dd>
        <dt>Altura</dt><dd class="num">${s.altura?fmt(s.altura,2)+" m":"—"}</dd>
        <dt>Tempo para treinar</dt><dd>${esc(s.tempo)}</dd>
        <dt>Cadastrado em</dt><dd>${dataBR(s.criado)}</dd></dl></div>
      <div class="well"><h3 style="font-size:15px;margin:0 0 10px">Histórico de saúde</h3><dl class="kv">
        <dt>Lesão ou limitação</dt><dd>${esc(s.lesao)}</dd><dt>Medicamento contínuo</dt><dd>${esc(s.medicamento)}</dd><dt>Restrição alimentar</dt><dd>${esc(s.restricao)}</dd></dl>
        <div class="highlight" style="margin-top:14px;font-size:14px"><b>Aluno ativo.</b> Ficha liberada para nutrição e treino.</div></div>
    </div>
    <h3 style="font-size:15px;margin:20px 0 10px">Fotos de postura</h3>
    ${fotos.length?`<div class="grid g4" style="grid-template-columns:repeat(4,minmax(0,1fr));gap:10px">${fotos.map(([k,src])=>`<div class="photo" style="cursor:default"><img src="${src}" alt="Foto ${k}"></div>`).join("")}</div>`:'<p class="sub">Nenhuma foto enviada no cadastro.</p>'}`;
  }
  if(t==="avaliacao"){
    return `${admin?`<div class="well" style="margin-bottom:16px">
      <h3 style="font-size:15px;margin:0 0 10px">Registrar nova avaliação</h3>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px">
        <div><label class="f" for="ad">Data</label><input class="inp" type="date" id="ad" value="${new Date().toISOString().slice(0,10)}"></div>
        <div><label class="f" for="ap">Peso (kg)</label><input class="inp num" id="ap" inputmode="decimal" required></div>
        <div><label class="f" for="ag">Gordura (%)</label><input class="inp num" id="ag" inputmode="decimal"></div>
        <div><label class="f" for="am">Massa muscular (kg)</label><input class="inp num" id="am" inputmode="decimal"></div>
        <div><label class="f" for="ab">Metab. basal (kcal)</label><input class="inp num" id="ab" inputmode="numeric"></div>
      </div><div class="err" id="aerr"></div><button type="button" class="btn sm" onclick="addAv('${s.id}')">Salvar avaliação</button></div>`:""}
    <div class="grid g2" style="margin-bottom:16px">
      <div class="well chart-box"><h3>Peso corporal (kg)</h3>${lineChart(s.avaliacoes.map(a=>({x:dataBR(a.data).slice(0,5),y:a.peso})),"kg")}</div>
      <div class="well chart-box"><h3>Gordura corporal (%)</h3>${lineChart(s.avaliacoes.filter(a=>a.gordura!=null).map(a=>({x:dataBR(a.data).slice(0,5),y:a.gordura})),"%","var(--pink)")}</div>
    </div>
    <div class="table-wrap"><table><thead><tr><th>Data</th><th class="num">Peso</th><th class="num">IMC</th><th class="num">Gordura</th><th class="num">Massa muscular</th><th class="num">Metab. basal</th>${admin?"<th></th>":""}</tr></thead><tbody>
    ${s.avaliacoes.slice().reverse().map((a,i)=>`<tr><td>${dataBR(a.data)}</td><td class="num">${fmt(a.peso)} kg</td><td class="num">${fmt(imc(a.peso,s.altura))}</td><td class="num">${a.gordura!=null?fmt(a.gordura)+" %":"—"}</td><td class="num">${a.massa!=null?fmt(a.massa)+" kg":"—"}</td><td class="num">${a.bmr!=null?fmt(a.bmr,0)+" kcal":"—"}</td>${admin?`<td><button class="btn ghost sm" onclick="delAv('${s.id}',${s.avaliacoes.length-1-i})">Remover</button></td>`:""}</tr>`).join("")||`<tr><td colspan="7" style="color:var(--muted)">Nenhuma avaliação registrada.</td></tr>`}
    </tbody></table></div>`;
  }
  if(t==="bio"){
    return `${admin?`<div class="well" style="margin-bottom:16px">
      <h3 style="font-size:15px;margin:0 0 10px">Registrar bioimpedância</h3>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px">
        <div><label class="f" for="bd">Data</label><input class="inp" type="date" id="bd" value="${new Date().toISOString().slice(0,10)}"></div>
        <div><label class="f" for="bw">Água corporal (%)</label><input class="inp num" id="bw" inputmode="decimal" required></div>
        <div><label class="f" for="bv">Gordura visceral (nível)</label><input class="inp num" id="bv" inputmode="numeric"></div>
        <div><label class="f" for="bi">Idade metabólica</label><input class="inp num" id="bi" inputmode="numeric"></div>
      </div><button type="button" class="btn sm" style="margin-top:12px" onclick="addBio('${s.id}')">Salvar bioimpedância</button></div>`:""}
    <div class="table-wrap"><table><thead><tr><th>Data</th><th class="num">Água corporal</th><th class="num">Gordura visceral</th><th class="num">Idade metabólica</th></tr></thead><tbody>
    ${s.bios.slice().reverse().map(b=>`<tr><td>${dataBR(b.data)}</td><td class="num">${fmt(b.agua)} %</td><td class="num">${b.visceral??"—"}</td><td class="num">${b.idade?b.idade+" anos":"—"}</td></tr>`).join("")||`<tr><td colspan="4" style="color:var(--muted)">Nenhuma bioimpedância registrada.</td></tr>`}
    </tbody></table></div>`;
  }
  if(t==="plano"||t==="treino"){
    const k=t, label=t==="plano"?"Plano alimentar":"Rotina de treinos";
    return admin ? `<label class="f" for="tx">${label}</label><textarea class="inp" id="tx" style="min-height:220px" placeholder="Escreva aqui o ${label.toLowerCase()} do aluno">${esc(s[k])}</textarea>
      <div class="row" style="margin-top:12px"><button class="btn sm" onclick="salvarTexto('${s.id}','${k}')">Salvar ${label.toLowerCase()}</button></div>`
      : (s[k]?`<div style="white-space:pre-wrap">${esc(s[k])}</div>`:`<p class="sub">Seu ${label.toLowerCase()} ainda não foi liberado. Ele aparece aqui assim que o profissional salvar.</p>`);
  }
  if(t==="relatorio"){
    const p=s.avaliacoes[0], v=u?imc(u.peso,s.altura):null, [cl,cc]=imcClasse(v);
    return `<h3 style="font-size:16px;margin:0 0 12px">Resumo de ${esc(firstName(s.nome))}</h3>
    <div class="grid g4" style="margin-bottom:16px">
      <div class="well metric"><div class="lbl">Peso atual</div><div class="num">${u?fmt(u.peso)+" kg":"—"}</div></div>
      <div class="well metric"><div class="lbl">Variação de peso</div><div class="num">${p&&u&&p!==u?((u.peso-p.peso>0?"+":"")+fmt(u.peso-p.peso)+" kg"):"—"}</div></div>
      <div class="well metric"><div class="lbl">IMC</div><div class="num">${fmt(v)}</div><span class="pill ${cc}" style="margin-top:6px">${cl}</span></div>
      <div class="well metric"><div class="lbl">Avaliações</div><div class="num">${s.avaliacoes.length}</div></div>
    </div>
    <p class="sub">A exportação em PDF fica para a versão com servidor. Aqui o resumo serve para conferir os números antes de gerar o documento.</p>`;
  }
}
function addAv(id){
  const s=db.students.find(x=>x.id===id), peso=num($("#ap").value);
  if(!peso||peso<20||peso>350){ $("#aerr").textContent="Informe um peso válido em kg."; return; }
  s.avaliacoes.push({data:$("#ad").value,peso,gordura:num($("#ag").value),massa:num($("#am").value),bmr:num($("#ab").value)});
  s.avaliacoes.sort((a,b)=>a.data.localeCompare(b.data)); save(); toast("Avaliação salva."); render();
}
function delAv(id,i){ const s=db.students.find(x=>x.id===id); if(!confirm("Remover esta avaliação?")) return; s.avaliacoes.splice(i,1); save(); render(); }
function addBio(id){ const s=db.students.find(x=>x.id===id); s.bios.push({data:$("#bd").value,agua:num($("#bw").value),visceral:num($("#bv").value),idade:num($("#bi").value)}); s.bios.sort((a,b)=>a.data.localeCompare(b.data)); save(); toast("Bioimpedância salva."); render(); }
function salvarTexto(id,k){ const s=db.students.find(x=>x.id===id); s[k]=$("#tx").value; save(); toast("Salvo."); }
function excluir(id){ const s=db.students.find(x=>x.id===id); if(!confirm(`Excluir ${s.nome}? Essa ação não pode ser desfeita.`)) return; db.students=db.students.filter(x=>x.id!==id); save(); toast("Aluno excluído."); go({view:"painel",dashTab:"alunos"}); }
function resetar(){ if(!confirm("Apagar tudo e voltar aos dados de exemplo?")) return; db=seed(); save(); go({view:"login"}); }

/* ===================== Render ===================== */
function render(){
  const v = ui.view==="login" ? viewLogin() : ui.view==="painel" ? viewPainel() : viewFicha();
  const app=$("#app");
  app.className = ui._anim ? "animate" : "";
  app.innerHTML = v + (ui.view!=="login" ? "" : `<div style="text-align:center;padding-bottom:24px"><button class="btn ghost sm" onclick="resetar()">Restaurar dados de exemplo</button></div>`);
  if(ui._anim) contar();
}
const semMov = matchMedia("(prefers-reduced-motion: reduce)").matches;
function contar(){
  if(semMov) return;
  document.querySelectorAll("[data-n]").forEach((el,i)=>{
    const alvo=+el.dataset.n, t0=performance.now()+i*60, dur=1100;
    el.textContent="0";
    const passo=t=>{ const p=Math.min(1,Math.max(0,(t-t0)/dur)), e=1-Math.pow(2,-10*p);
      el.textContent=Math.round(alvo*(p>=1?1:e)).toLocaleString("pt-BR"); if(p<1) requestAnimationFrame(passo); };
    requestAnimationFrame(passo);
  });
}
try{
  const ss = JSON.parse(sessionStorage.getItem(SKEY));
  if(ss?.tipo==="admin"){ ui.sessao=ss; ui.view="painel"; }
  else if(ss?.tipo==="aluno" && db.students.some(x=>x.id===ss.id)){ ui.sessao=ss; ui.view="ficha"; ui.studentId=ss.id; }
}catch(e){}
ui._anim=true; render(); ui._anim=false;
</script>
</body>
</html>
